# Example host ingress; replace hostname and provision certificates before use.
events { worker_connections 1024; }
http {
    limit_req_zone $binary_remote_addr zone=client_rate:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=client_connections:10m;
    log_format judge '$remote_addr $request_method $uri $status $request_time';
    access_log /var/log/nginx/cjudge.log judge;
    server {
        listen 443 ssl;
        server_name judge.example.com;
        ssl_certificate /etc/ssl/cjudge/fullchain.pem;
        ssl_certificate_key /etc/ssl/cjudge/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 26m;
        client_body_timeout 20s;
        client_header_timeout 5s;
        keepalive_timeout 30s;
        limit_conn client_connections 16;
        limit_req zone=client_rate burst=20 nodelay;
        limit_req_status 429;
        location /metrics { return 404; } # Scrape the private API directly.
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 20s;
            proxy_send_timeout 20s;
        }
    }
}
